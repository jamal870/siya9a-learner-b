name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest app (self-contained with embedded questions)
        run: |
          curl -L "https://customer-assets.emergentagent.com/wingman/4d44713c-9dca-4916-aa13-fa626c7c4ce4/attachments/2f14564f323c4e5c910c3885b627ae44_index.html" \
            -o index.html
          echo "App size: $(wc -c < index.html) bytes"
          grep -c '"id":' index.html | xargs echo "Questions embedded:"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
